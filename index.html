<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My City</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">MYCITY</a>
  </div>
</nav>

<!-- Header -->
<header>
  Pune City
</header>

<!-- Content -->
<div class="container mt-4">

  <h3>Famous Landmarks</h3>

  <!-- Landmark 1 -->
  <div class="landmark red-font">
    Shaniwar Wada
    <button class="btn btn-primary btn-sm" onclick="showImage('img1')">Show</button>
    <img id="img1" src="https://lh3.googleusercontent.com/gps-cs-s/APNQkAH2N4bgewMuIHAgr1x0rp4fUnP-lxpm0iMQrYXR-hWfqaiyk2nqMmkE21yduoiaGRWtiRVd-AAZGjihdeVUSLc2wmbC0EOLbeN-HhyI4WXEQxdPMqFxaq-4e334RiQkWSI9Xq7OR3hCBq_0=s1360-w1360-h1020-rw">
  </div>

  <!-- Landmark 2 -->
  <div class="landmark green-font">
    Aga Khan Palace
    <button class="btn btn-primary btn-sm" onclick="showImage('img2')">Show</button>
    <img id="img2" src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Pune_Palace.jpg/1280px-Pune_Palace.jpg">
  </div>

  <!-- Landmark 3 -->
  <div class="landmark blue-font">
    Sinhagad Fort
    <button class="btn btn-primary btn-sm" onclick="showImage('img3')">Show</button>
    <img id="img3" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4Ocz8Ul1AfBWIg6tRFM1Du_-wkphO47tdCQ&s">
  </div>

</div>

<!-- Footer -->
<footer>
  © 2026 My City Webpage
</footer> 

<!-- JavaScript -->
<script>
  function showImage(id) {
    var img = document.getElementById(id);
    if (img.style.display === "block") {
      img.style.display = "none";
    } else {
      img.style.display = "block";
    }
  }
</script>

</body>
</html>
